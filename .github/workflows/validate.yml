# Runs only when started by hand (Actions tab, "Run workflow"): the kit's tests and content checks
# on the oldest and the newest supported Node. Nothing runs on push or pull request.
name: validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
